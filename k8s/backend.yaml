apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: trendo-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: backend
          image: trendo-backend:local
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8007
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8007
            initialDelaySeconds: 10
            periodSeconds: 15
          ports:
            - containerPort: 8007

          env:
            # =========================
            # OPENAI
            # =========================
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: trendo-secret
                  key: OPENAI_API_KEY

            # =========================
            # STORAGE
            # =========================
            - name: UPLOAD_DIR
              value: /data/uploads

            # =========================
            # FILE SECURITY (Trend)
            # =========================
            - name: FILE_SECURITY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: trendo-file-security
                  key: FILE_SECURITY_API_KEY

            - name: FILE_SECURITY_HOST
              valueFrom:
                secretKeyRef:
                  name: trendo-file-security
                  key: FILE_SECURITY_HOST

            # =========================
            # AI GUARD (Trend)
            # =========================
            - name: TREND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: trendo-ai
                  key: TREND_API_KEY

            - name: TREND_AI_URL
              valueFrom:
                secretKeyRef:
                  name: trendo-ai
                  key: TREND_AI_URL

            - name: TREND_AI_APP_NAME
              valueFrom:
                secretKeyRef:
                  name: trendo-ai
                  key: TREND_AI_APP_NAME

            - name: OPENAI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: trendo-config
                  key: OPENAI_MODEL
            - name: GUARD_FAIL_OPEN
              valueFrom:
                configMapKeyRef:
                  name: trendo-config
                  key: GUARD_FAIL_OPEN
            - name: MAX_UPLOAD_BYTES
              value: "20971520"
            - name: TM_AM_SCAN_TIMEOUT_SECS
              value: "60"
            - name: FILE_SECURITY_TLS
              value: "false"

          volumeMounts:
            - name: uploads-volume
              mountPath: /data/uploads

      volumes:
        - name: uploads-volume
          persistentVolumeClaim:
            claimName: uploads-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: trendo-demo
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8007
      targetPort: 8007
