name: TMAS Image Scan
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  image-scan:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen de esta revisión
        run: docker build --pull -t trendo-${{ matrix.app }}:${{ github.sha }} portal-${{ matrix.app }}
      - name: Analizar la misma imagen construida
        uses: trendmicro/tmas-scan-action@v3.1.3
        with:
          version: "2"
          vulnerabilitiesScan: true
          malwareScan: true
          secretsScan: true
          artifact: docker:trendo-${{ matrix.app }}:${{ github.sha }}
          additionalArgs: --region=eu-central-1
          tmasApiKey: ${{ secrets.TMAS_API_KEY }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
