name: TMAS AI Scanner — LLM Vulnerability Scan

on:
  push:
    branches: [main]
    paths:
      - "portal-backend/app/services/chatbot.py"
      - "portal-backend/app/services/ai_guard.py"
      - "portal-backend/app/routes/chat.py"
      - "security/ai-scanner/**"
      - "scripts/run_ai_scanner.sh"
      - "scripts/lib/install-tmas.py"
      - ".github/workflows/tmas-ai-scanner.yml"
  pull_request:
    paths:
      - "portal-backend/app/services/chatbot.py"
      - "portal-backend/app/services/ai_guard.py"
      - "portal-backend/app/routes/chat.py"
      - "security/ai-scanner/**"
      - "scripts/run_ai_scanner.sh"
      - "scripts/lib/install-tmas.py"
      - ".github/workflows/tmas-ai-scanner.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  tmas-ai-scanner:
    name: TMAS AI Scanner — Modelo LLM
    # Los forks no reciben credenciales. El esquema se valida además en validate.yml.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar configuración con el CLI fijado
        run: ./scripts/run_ai_scanner.sh --check
      - name: Comprobar secretos necesarios
        env:
          TMAS_API_KEY: ${{ secrets.TMAS_API_KEY }}
          TARGET_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          missing=0
          if [[ -z "$TMAS_API_KEY" ]]; then
            echo "::error::Falta el secreto TMAS_API_KEY en Settings > Secrets and variables > Actions."
            missing=1
          fi
          if [[ -z "$TARGET_API_KEY" ]]; then
            echo "::error::Falta el secreto OPENAI_API_KEY en Settings > Secrets and variables > Actions."
            missing=1
          fi
          exit "$missing"
      - name: Ejecutar AI Scanner contra el modelo OpenAI
        env:
          TMAS_API_KEY: ${{ secrets.TMAS_API_KEY }}
          TARGET_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: ./scripts/run_ai_scanner.sh
      - name: Publicar resultados en el PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const root = '.runtime/ai-scanner/results';
            if (!fs.existsSync(root)) return;
            const scan = fs.readdirSync(root).sort().pop();
            if (!scan) return;
            const reportPath = `${root}/${scan}/ai-scanner-report.md`;
            if (!fs.existsSync(reportPath)) return;
            const body = `## TMAS AI Scanner — Resultados del modelo\n\n${fs.readFileSync(reportPath, 'utf8')}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.slice(0, 65536)
            });
      - name: Guardar artefactos del escaneo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmas-ai-scanner-results
          path: .runtime/ai-scanner/results/
          if-no-files-found: warn
          retention-days: 30
